plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.example.detectionexample.wear'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.detectionexample.wear"
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName "1.0"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':core:model')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose

    // Wear Compose Material 3, Foundation, and Navigation 3
    implementation libs.androidx.wear.compose.material3
    implementation libs.androidx.wear.compose.foundation
    implementation libs.androidx.wear.compose.navigation3

    // Compose core & Tooling
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.wear.compose.ui.tooling

    // Glance Wear and Remote Compose
    implementation libs.androidx.glance.wear
    implementation libs.androidx.glance.wear.core
    implementation libs.androidx.glance.wear.tooling.preview
    implementation libs.androidx.compose.remote.creation.compose
    implementation libs.androidx.compose.remote.creation
    implementation libs.androidx.compose.remote.core
    implementation libs.androidx.compose.remote.tooling.preview
    implementation libs.androidx.wear.compose.remote.material3

    // Navigation 3
    implementation libs.androidx.navigation3.runtime
    implementation libs.androidx.navigation3.ui
    implementation libs.kotlinx.serialization.json

    // Testing
    testImplementation libs.junit
    testImplementation libs.androidx.test.core
    testImplementation libs.robolectric
}
